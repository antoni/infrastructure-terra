---
- name: Validate mountain_tile_backend variables
  ansible.builtin.assert:
    that:
      - mountain_tile_backend_project_dir is string
      - mountain_tile_backend_project_dir | length > 1
      - mountain_tile_backend_project_dir[0] == '/'
      - mountain_tile_backend_release_root[0] == '/'
      - mountain_tile_backend_tile_store[0] == '/'
      - mountain_tile_backend_domain | length > 0
      - >-
        mountain_tile_backend_domain == 'localhost' or
        mountain_tile_backend_domain is match('^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,}$')
      - mountain_tile_backend_public_scheme in ['http', 'https']
      - mountain_tile_backend_host_port | int > 0
      - mountain_tile_backend_host_port | int < 65536
      - mountain_tile_backend_pmtiles_cache_size_mb | int > 0
      - mountain_tile_backend_health_retries | int > 0
      - mountain_tile_backend_health_delay | int >= 0
      - mountain_tile_backend_current_cache_seconds | int >= 0
      - mountain_tile_backend_immutable_cache_seconds | int > 0
      - mountain_tile_backend_activate_release == '' or
        (mountain_tile_backend_activate_release is match('^[A-Za-z0-9._-]+$'))
      - mountain_tile_backend_activate_release not in ['.', '..', 'current']
    fail_msg: >-
      Invalid mountain_tile_backend role configuration. mountain_tile_backend_domain is required and must
      be a fully qualified hostname (or localhost for a local rehearsal).

- name: Check Docker CLI
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: mountain_tile_backend_docker_version
  changed_when: false

- name: Check Docker Compose v2
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: mountain_tile_backend_compose_version
  changed_when: false

- name: Check requested release before activation
  ansible.builtin.stat:
    path: "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_activate_release }}"
  register: mountain_tile_backend_requested_release_stat
  when: mountain_tile_backend_activate_release | length > 0

- name: Require requested release to already exist
  ansible.builtin.assert:
    that:
      - mountain_tile_backend_requested_release_stat.stat.exists | default(false)
      - mountain_tile_backend_requested_release_stat.stat.isdir | default(false)
    fail_msg: >-
      Requested release {{ mountain_tile_backend_activate_release }} does not exist at
      {{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_activate_release }}.
      terrain-platform must build/copy the complete release before this role activates it.
  when: mountain_tile_backend_activate_release | length > 0

- name: Inspect existing current path
  ansible.builtin.stat:
    path: "{{ mountain_tile_backend_current_path }}"
    follow: false
  register: mountain_tile_backend_current_stat

- name: Refuse a non-symlink current path
  ansible.builtin.assert:
    that:
      - >-
        not (mountain_tile_backend_current_stat.stat.exists | default(false)) or
        (mountain_tile_backend_current_stat.stat.islnk | default(false))
    fail_msg: >-
      {{ mountain_tile_backend_current_path }} exists but is not a symlink.
      Refusing to replace it because release activation must be atomic.


- name: Validate the TLS mode inherited from reverse_proxy
  ansible.builtin.assert:
    that:
      - mountain_tile_backend_tls_mode in ['letsencrypt_nginx', 'tailscale', 'manual']
      - mountain_tile_backend_tls_certificate | length > 0
      - mountain_tile_backend_tls_certificate_key | length > 0
    fail_msg: >-
      The TLS certificate paths could not be derived from reverse_proxy_certificate_mode
      ({{ mountain_tile_backend_tls_mode }}). In manual mode set reverse_proxy_ssl_certificate and
      reverse_proxy_ssl_certificate_key.
  when:
    - mountain_tile_backend_manage_vhost | bool
    - mountain_tile_backend_public_scheme == 'https'

- name: Check the shared reverse proxy is installed
  ansible.builtin.stat:
    path: "{{ mountain_tile_backend_nginx_snippets_dir }}/{{ item }}"
  loop: "{{ ['ssl.conf', 'security-headers.conf', 'proxy.conf'] + (['geoblocking-enforce.conf'] if mountain_tile_backend_geoblocking_enforce | bool else []) }}"
  register: mountain_tile_backend_proxy_snippets
  when: mountain_tile_backend_manage_vhost | bool

- name: Require the shared reverse proxy's snippets
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      {{ item.item }} is missing from {{ mountain_tile_backend_nginx_snippets_dir }}. The vhost this role
      writes includes the snippets of the reverse_proxy role (yourorg.shared_roles); run that role on the
      host first (playbooks/tile_backend_host.yml does), or set mountain_tile_backend_manage_vhost: false
      for a host whose proxy is configured some other way.
  loop: "{{ mountain_tile_backend_proxy_snippets.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: mountain_tile_backend_manage_vhost | bool

- name: Check managed TLS certificate files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ mountain_tile_backend_tls_certificate }}"
    - "{{ mountain_tile_backend_tls_certificate_key }}"
  register: mountain_tile_backend_certificate_stats
  when:
    - mountain_tile_backend_manage_vhost | bool
    - mountain_tile_backend_public_scheme == 'https'

- name: Require managed TLS certificate files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
    fail_msg: >-
      The TLS file {{ item.item }} does not exist, so nginx would refuse the vhost. This role does not
      issue certificates: list {{ mountain_tile_backend_domain }} in reverse_proxy_certificates (mode
      letsencrypt_nginx) and run the reverse_proxy role before this one.
  loop: "{{ mountain_tile_backend_certificate_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - mountain_tile_backend_manage_vhost | bool
    - mountain_tile_backend_public_scheme == 'https'
