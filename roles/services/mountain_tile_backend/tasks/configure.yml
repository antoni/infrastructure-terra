---
- name: Render Compose environment
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ mountain_tile_backend_env_path }}"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0600"
  notify: Restart mountain_tile_backend compose

- name: Render Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mountain_tile_backend_compose_path }}"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0644"
  notify: Restart mountain_tile_backend compose

- name: Render container Nginx server block
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ mountain_tile_backend_container_nginx_path }}"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0644"
  notify: Restart mountain_tile_backend compose

- name: Read currently active release
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ mountain_tile_backend_current_path }}"
  register: mountain_tile_backend_current_readlink
  changed_when: false
  failed_when: false

- name: Resolve release to validate and serve
  ansible.builtin.set_fact:
    mountain_tile_backend_active_release: >-
      {{
        mountain_tile_backend_activate_release
        if (mountain_tile_backend_activate_release | length > 0)
        else (
          mountain_tile_backend_current_readlink.stdout | basename
          if mountain_tile_backend_current_readlink.rc == 0
          else ''
        )
      }}

- name: Require an active release
  ansible.builtin.assert:
    that:
      - mountain_tile_backend_active_release | length > 0
      - mountain_tile_backend_active_release is match('^[A-Za-z0-9._-]+$')
    fail_msg: >-
      No active release exists. Copy a complete terrain-platform release below
      {{ mountain_tile_backend_release_root }} and set mountain_tile_backend_activate_release.

- name: Validate release contract
  ansible.builtin.command:
    argv:
      - python3
      - "{{ mountain_tile_backend_bin_dir }}/validate_release.py"
      - --release-dir
      - "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_active_release }}"
      - --release-id
      - "{{ mountain_tile_backend_active_release }}"
      - --public-base-url
      - "{{ mountain_tile_backend_public_base_url }}"
      - --require-publishable
      - "{{ mountain_tile_backend_require_publishable | bool | ternary('true', 'false') }}"
  changed_when: false
  when: mountain_tile_backend_validate_release | bool

- name: Check PMTiles image
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ mountain_tile_backend_pmtiles_image }}"
  register: mountain_tile_backend_pmtiles_image_inspect
  changed_when: false
  failed_when: false
  when: mountain_tile_backend_verify_pmtiles | bool

- name: Pull PMTiles image when absent
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ mountain_tile_backend_pmtiles_image }}"
  when:
    - mountain_tile_backend_verify_pmtiles | bool
    - mountain_tile_backend_pmtiles_image_inspect.rc != 0
  changed_when: true

- name: Find PMTiles archives in active release
  ansible.builtin.find:
    paths: "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_active_release }}/pmtiles"
    patterns: "*.pmtiles"
    file_type: file
    recurse: true
  register: mountain_tile_backend_pmtiles_archives
  when: mountain_tile_backend_verify_pmtiles | bool

- name: Verify every PMTiles archive before activation
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --read-only
      - --security-opt
      - no-new-privileges:true
      - --cap-drop
      - ALL
      - -v
      - "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_active_release }}/pmtiles:/data:ro"
      - "{{ mountain_tile_backend_pmtiles_image }}"
      - verify
      - "/data/{{ item.path | dirname | basename }}/{{ item.path | basename }}"
  loop: "{{ mountain_tile_backend_pmtiles_archives.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  when: mountain_tile_backend_verify_pmtiles | bool

- name: Retain content-addressed archives before activation
  ansible.builtin.command:
    argv:
      - python3
      - "{{ mountain_tile_backend_bin_dir }}/sync_tile_store.py"
      - --release-dir
      - "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_active_release }}"
      - --tile-store
      - "{{ mountain_tile_backend_tile_store }}"
  register: mountain_tile_backend_tile_store_sync
  changed_when: "'indexed ' in mountain_tile_backend_tile_store_sync.stdout"

- name: Atomically activate requested release
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ mountain_tile_backend_release_root | quote }}
    ln -sfn -- {{ mountain_tile_backend_active_release | quote }} .current.next
    mv -Tf -- .current.next current
  args:
    executable: /bin/bash
  when:
    - mountain_tile_backend_activate_release | length > 0
    - mountain_tile_backend_current_readlink.rc != 0 or
      (mountain_tile_backend_current_readlink.stdout | basename) != mountain_tile_backend_active_release
  changed_when: true

- name: Install the vhost on the shared reverse proxy
  when: mountain_tile_backend_manage_vhost | bool
  block:
    - name: Install the forwarding snippet for the vhost
      ansible.builtin.template:
        src: proxy-origin.conf.j2
        dest: "{{ mountain_tile_backend_nginx_snippets_dir }}/mountain_tile_backend_proxy.conf"
        owner: root
        group: root
        mode: "0644"
      when: mountain_tile_backend_upstream_keepalive | int > 0

    - name: Render host reverse-proxy vhost
      ansible.builtin.template:
        src: nginx-vhost.conf.j2
        dest: "{{ mountain_tile_backend_vhost_available_path }}"
        owner: root
        group: root
        mode: "0644"
      register: mountain_tile_backend_vhost_rendered

    - name: Enable host reverse-proxy vhost
      ansible.builtin.file:
        src: "{{ mountain_tile_backend_vhost_available_path }}"
        dest: "{{ mountain_tile_backend_vhost_enabled_path }}"
        state: link
        force: true
      register: mountain_tile_backend_vhost_linked

    # The proxy is shared: a vhost that does not load must never stay enabled, or the next restart of nginx
    # (and with it every other application behind it) fails.
    - name: Check the host nginx configuration loads with the new vhost
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      check_mode: false

    - name: Reload host nginx when the vhost changed
      ansible.builtin.debug:
        msg: The vhost changed; the shared nginx is reloaded after the containers are up.
      changed_when: mountain_tile_backend_vhost_rendered.changed or mountain_tile_backend_vhost_linked.changed
      notify: Reload host nginx
  rescue:
    - name: Take the vhost out again because nginx cannot load it
      ansible.builtin.file:
        path: "{{ mountain_tile_backend_vhost_enabled_path }}"
        state: absent

    - name: Fail with the reason
      ansible.builtin.fail:
        msg: >-
          nginx rejected the vhost for {{ mountain_tile_backend_domain }}; it was taken out again and the
          running configuration is unchanged. Inspect {{ mountain_tile_backend_vhost_available_path }} and run
          `nginx -t`.
