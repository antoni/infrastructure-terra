---
- name: Start mountain_tile_backend services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ mountain_tile_backend_project_dir }}"
      - --project-name
      - "{{ mountain_tile_backend_compose_project }}"
      - up
      - -d
      - --remove-orphans
  changed_when: false

- name: Wait for local health check
  block:
    - name: Poll /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mountain_tile_backend_host_port }}/healthz"
        method: GET
        status_code: 204
        return_content: false
      register: mountain_tile_backend_health_result
      retries: "{{ mountain_tile_backend_health_retries }}"
      delay: "{{ mountain_tile_backend_health_delay }}"
      until: mountain_tile_backend_health_result.status == 204
      changed_when: false
  rescue:
    - name: Capture recent compose logs
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ mountain_tile_backend_project_dir }}"
          - --project-name
          - "{{ mountain_tile_backend_compose_project }}"
          - logs
          - --tail
          - "50"
      register: mountain_tile_backend_failed_logs
      changed_when: false
      failed_when: false

    - name: Fail with service logs
      ansible.builtin.fail:
        msg: |-
          mountain_tile_backend failed its local health check.
          Recent logs:
          {{ mountain_tile_backend_failed_logs.stdout | default('No logs available') }}

- name: Smoke check current capabilities
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mountain_tile_backend_host_port }}/api/capabilities"
    method: GET
    status_code: 200
    return_content: true
  register: mountain_tile_backend_capabilities_smoke
  changed_when: false
  when: mountain_tile_backend_smoke_tests | bool

- name: Assert capabilities is a JSON object
  ansible.builtin.assert:
    that:
      - mountain_tile_backend_capabilities_smoke.content | from_json is mapping
  when: mountain_tile_backend_smoke_tests | bool

- name: Find active release TileJSON files
  ansible.builtin.find:
    paths: "{{ mountain_tile_backend_release_root }}/{{ mountain_tile_backend_active_release }}/tilejson"
    patterns: "*.json"
    file_type: file
    recurse: false
  register: mountain_tile_backend_tilejson_files
  when: mountain_tile_backend_smoke_tests | bool

- name: Smoke check every TileJSON through versioned release URL
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ mountain_tile_backend_host_port }}/releases/{{
      mountain_tile_backend_active_release }}/tilejson/{{ item.path | basename }}
    method: GET
    status_code: 200
    return_content: true
  loop: "{{ mountain_tile_backend_tilejson_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: mountain_tile_backend_tilejson_smoke
  changed_when: false
  when: mountain_tile_backend_smoke_tests | bool

- name: Smoke check one real tile from every PMTiles dataset
  ansible.builtin.command:
    argv:
      - python3
      - "{{ mountain_tile_backend_bin_dir }}/smoke_pmtiles.py"
      - --release-root
      - "{{ mountain_tile_backend_release_root }}"
      - --release
      - "{{ mountain_tile_backend_active_release }}"
      - --base-url
      - "http://127.0.0.1:{{ mountain_tile_backend_host_port }}"
      - --timeout
      - "{{ mountain_tile_backend_smoke_timeout_seconds | string }}"
  changed_when: false
  when: mountain_tile_backend_smoke_tests | bool

- name: Smoke check the public path through the shared reverse proxy
  when:
    - mountain_tile_backend_smoke_tests | bool
    - mountain_tile_backend_manage_vhost | bool
  block:
    - name: Health check through the proxy (the Host header selects the vhost)
      ansible.builtin.uri:
        url: "{{ 'https' if mountain_tile_backend_public_scheme == 'https' else 'http' }}://127.0.0.1/healthz"
        headers:
          Host: "{{ mountain_tile_backend_domain }}"
        validate_certs: false
        status_code: 204
      register: mountain_tile_backend_proxy_health
      retries: 5
      delay: 2
      until: mountain_tile_backend_proxy_health.status == 204
      changed_when: false

    - name: Plain HTTP is redirected to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/healthz
        headers:
          Host: "{{ mountain_tile_backend_domain }}"
        follow_redirects: none
        status_code: 301
      register: mountain_tile_backend_http_redirect
      changed_when: false
      when: mountain_tile_backend_public_scheme == 'https'

    - name: The redirect keeps the host and goes to HTTPS
      ansible.builtin.assert:
        that:
          - mountain_tile_backend_http_redirect.location == 'https://' ~ mountain_tile_backend_domain ~ '/healthz'
      when: mountain_tile_backend_public_scheme == 'https'

    - name: Capabilities through the proxy name the active release
      ansible.builtin.uri:
        url: "{{ 'https' if mountain_tile_backend_public_scheme == 'https' else 'http' }}://127.0.0.1/api/capabilities"
        headers:
          Host: "{{ mountain_tile_backend_domain }}"
        validate_certs: false
        return_content: true
      register: mountain_tile_backend_proxy_capabilities
      changed_when: false

    - name: The shared proxy's security headers are present
      ansible.builtin.assert:
        that:
          - mountain_tile_backend_proxy_capabilities.x_content_type_options | default('') == 'nosniff'
          - mountain_tile_backend_public_scheme != 'https' or
            (mountain_tile_backend_proxy_capabilities.strict_transport_security | default('') | length > 0)
        fail_msg: >-
          The response through the reverse proxy lacks X-Content-Type-Options or Strict-Transport-Security, so
          the vhost does not include the reverse_proxy role's security-headers snippet as intended.
