---
- name: Create mountain_tile_backend directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ mountain_tile_backend_project_dir }}", mode: "0755" }
    - { path: "{{ mountain_tile_backend_nginx_dir }}", mode: "0755" }
    - { path: "{{ mountain_tile_backend_bin_dir }}", mode: "0755" }
    - { path: "{{ mountain_tile_backend_release_root }}", mode: "0755" }

- name: Install release validator
  ansible.builtin.copy:
    src: validate_release.py
    dest: "{{ mountain_tile_backend_bin_dir }}/validate_release.py"
    owner: root
    group: root
    mode: "0755"

- name: Install PMTiles smoke checker
  ansible.builtin.copy:
    src: smoke_pmtiles.py
    dest: "{{ mountain_tile_backend_bin_dir }}/smoke_pmtiles.py"
    owner: root
    group: root
    mode: "0755"
