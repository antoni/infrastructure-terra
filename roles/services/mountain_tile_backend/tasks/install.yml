---
- name: Create mountain_tile_backend directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ mountain_tile_backend_project_dir }}"
      mode: "0755"
    - path: "{{ mountain_tile_backend_nginx_dir }}"
      mode: "0755"
    - path: "{{ mountain_tile_backend_bin_dir }}"
      mode: "0755"
    - path: "{{ mountain_tile_backend_release_root }}"
      mode: "0755"
    - path: "{{ mountain_tile_backend_tile_store }}"
      mode: "0755"

- name: Install release validator
  ansible.builtin.copy:
    src: validate_release.py
    dest: "{{ mountain_tile_backend_bin_dir }}/validate_release.py"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0755"

- name: Install PMTiles smoke checker
  ansible.builtin.copy:
    src: smoke_pmtiles.py
    dest: "{{ mountain_tile_backend_bin_dir }}/smoke_pmtiles.py"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0755"

- name: Install content-addressed tile store indexer
  ansible.builtin.copy:
    src: sync_tile_store.py
    dest: "{{ mountain_tile_backend_bin_dir }}/sync_tile_store.py"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0755"

- name: Install release retention tool
  ansible.builtin.copy:
    src: prune_releases.py
    dest: "{{ mountain_tile_backend_bin_dir }}/prune_releases.py"
    owner: "{{ mountain_tile_backend_owner }}"
    group: "{{ mountain_tile_backend_group }}"
    mode: "0755"
