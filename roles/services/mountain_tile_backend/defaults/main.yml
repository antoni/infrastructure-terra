---
# --- Where things live ------------------------------------------------------------------------------
mountain_tile_backend_project_dir: /opt/mountain_tile_backend
mountain_tile_backend_owner: root
mountain_tile_backend_group: root

# The public hostname. Required: there is deliberately no default, because a wrong default would send
# TLS and cache URLs to somebody else's name.
mountain_tile_backend_domain: ""
mountain_tile_backend_public_scheme: https
mountain_tile_backend_public_base_url: "{{ mountain_tile_backend_public_scheme }}://{{ mountain_tile_backend_domain }}"

# --- The containers ---------------------------------------------------------------------------------
# The origin listens on loopback only; the shared reverse proxy on the host is the only way in.
mountain_tile_backend_bind_address: 127.0.0.1
mountain_tile_backend_host_port: 8090
# Pin by tag, or by tag and digest (nginx:1.27-alpine@sha256:...) for a reproducible deployment.
mountain_tile_backend_nginx_image: nginx:1.27-alpine
mountain_tile_backend_pmtiles_image: ghcr.io/protomaps/go-pmtiles:v1.31.2
mountain_tile_backend_pmtiles_cache_size_mb: 256
mountain_tile_backend_compose_project: mountain_tile_backend

# Resource limits, so a runaway container cannot take the host (and the other applications behind the
# shared proxy) down with it. pmtiles serve holds a tile cache, hence the headroom over its cache size.
mountain_tile_backend_nginx_memory_limit: 128m
mountain_tile_backend_pmtiles_memory_limit: "{{ (mountain_tile_backend_pmtiles_cache_size_mb | int) + 384 }}m"
mountain_tile_backend_pids_limit: 128
# Docker log rotation per container, independent of the host's daemon.json (which geerlingguy.docker
# can set to the same values).
mountain_tile_backend_log_max_size: 20m
mountain_tile_backend_log_max_file: "5"

mountain_tile_backend_release_root: "{{ mountain_tile_backend_project_dir }}/releases"
mountain_tile_backend_tile_store: "{{ mountain_tile_backend_project_dir }}/tile-store"
mountain_tile_backend_current_path: "{{ mountain_tile_backend_release_root }}/current"

# Set to an immutable release directory name such as "2026.10.0" to activate it.
# Leave empty to keep the currently active release.
mountain_tile_backend_activate_release: ""

# Release validation is intentionally deployment-focused. Product/schema validation
# remains the terrain-platform pipeline's responsibility.
mountain_tile_backend_validate_release: true
mountain_tile_backend_require_publishable: true
mountain_tile_backend_verify_pmtiles: true

mountain_tile_backend_health_retries: 20
mountain_tile_backend_health_delay: 2
mountain_tile_backend_smoke_tests: true
mountain_tile_backend_smoke_timeout_seconds: 10

# Cache mutable "current" aliases briefly. Versioned release assets and tiles are
# immutable and may be cached for one year by the CDN.
mountain_tile_backend_current_cache_seconds: 300
mountain_tile_backend_immutable_cache_seconds: 31536000

# --- Retention --------------------------------------------------------------------------------------
# 0 keeps every release and archive for ever (disk fills up). N > 0 keeps the active release and the N most
# recent others after a verified deployment, and deletes tile-store archives no kept release lists. Tile URLs
# carry the archive hash and older apps keep requesting them, so only turn this on once the oldest app version
# in use is covered by those N releases.
mountain_tile_backend_keep_releases: 0

# --- The vhost on the shared reverse proxy ----------------------------------------------------------
# The reverse_proxy role (yourorg.shared_roles) owns nginx, TLS policy, certificates, security headers,
# real-IP handling and the rate-limit zones. This role only writes its own vhost, includes those
# snippets, and reloads nginx. It does not install nginx or certbot, and it does not issue certificates:
# list the domain in reverse_proxy_certificates and run that role first.
mountain_tile_backend_manage_vhost: true
mountain_tile_backend_nginx_sites_available_dir: "{{ reverse_proxy_sites_available_dir | default('/etc/nginx/sites-available') }}"
mountain_tile_backend_nginx_sites_enabled_dir: "{{ reverse_proxy_sites_enabled_dir | default('/etc/nginx/sites-enabled') }}"
mountain_tile_backend_nginx_snippets_dir: "{{ reverse_proxy_snippets_dir | default('/etc/nginx/snippets') }}"
# <domain>.conf is the name reverse_proxy's certificate bootstrap expects for a domain's vhost.
mountain_tile_backend_nginx_vhost_name: "{{ mountain_tile_backend_domain }}.conf"

# `http2 on;` needs nginx 1.25.1 or newer (Debian 13, Ubuntu 24.04). Set false on older nginx, which then
# gets `listen 443 ssl http2;`.
mountain_tile_backend_nginx_http2_directive: true
mountain_tile_backend_listen_ipv6: "{{ (ansible_facts.all_ipv6_addresses | default([])) | length > 0 }}"

# Keep-alive connections from the host nginx to the container nginx on loopback; 0 turns upstream keep-alive
# off and uses the shared proxy.conf unchanged (which closes the upstream connection after every request).
mountain_tile_backend_upstream_keepalive: 32

# Rate limiting at the host proxy. Off by default, deliberately: a map view asks for dozens of tiles at
# once, and behind a CDN every client shares the CDN's few addresses unless the proxy restores real
# client IPs (reverse_proxy_real_ip_*). Turn on only with that configured; the zones come from
# reverse_proxy (perip, addr) and these are the per-vhost limits applied to everything but /healthz.
mountain_tile_backend_rate_limit_enabled: false
mountain_tile_backend_rate_limit_burst: 300
mountain_tile_backend_rate_limit_connections: 100

# Include reverse_proxy's geoblocking-enforce.conf snippet (the rule itself is
# reverse_proxy_geoblocking_domains for this domain).
mountain_tile_backend_geoblocking_enforce: false

# Extra ACL for the vhost, for example to limit it to a private network during a rehearsal.
mountain_tile_backend_allow_cidrs: []
