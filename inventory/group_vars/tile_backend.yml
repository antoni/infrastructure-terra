---
# Settings shared by every tile origin host. Site-specific values (host, domain, e-mail) go in the
# private inventory, inventory/hosts.local.yml.

# --- Docker (geerlingguy.docker) --------------------------------------------------------------------
# Written to /etc/docker/daemon.json.
docker_daemon_options:
  # Logging driver used by containers unless overridden in Compose.
  #
  # "local" is Docker's recommended default for standalone hosts. It stores logs in a more efficient
  # format and rotates them automatically.
  #
  # If you're using Promtail to scrape /var/lib/docker/containers/*/*-json.log, use "json-file" instead.
  log-driver: local

  # Keep local logs bounded to prevent disk exhaustion.
  #
  # Each container retains up to: 20 MB x 5 files = ~100 MB. Old logs are removed automatically.
  log-opts:
    max-size: "20m"
    max-file: "5"

  # Publish container ports with iptables NAT instead of one docker-proxy process per port. The origin is
  # published on 127.0.0.1 only; with the userland proxy every request from the host nginx went through that
  # extra process (and a new TCP connection to it).
  userland-proxy: false

# --- Reverse proxy (yourorg.shared_roles.reverse_proxy) ---------------------------------------------
# The shared nginx for every application on the host: it installs nginx and obtains the certificates.
# mountain_tile_backend writes its own self-contained vhost on it (TLS settings, security headers and
# rate-limit zones of its own) and reads none of the reverse_proxy_* settings.
reverse_proxy_certificate_mode: letsencrypt_nginx
reverse_proxy_manage_certificates: true
reverse_proxy_certificates:
  - "{{ mountain_tile_backend_domain }}"
# reverse_proxy_email has no safe default: set it in the private inventory (the playbook refuses the
# role's placeholder address).

# --- Tile backend (yourorg.shared_roles.mountain_tile_backend) --------------------------------------
# The vhost's certificate files follow the proxy's certificate settings, so a host changes them in one
# place: Let's Encrypt's files for the domain, or the files given for manual mode (the throwaway VPS uses
# a self-signed certificate that way).
mountain_tile_backend_tls_certificate: >-
  {{ reverse_proxy_ssl_certificate if (reverse_proxy_certificate_mode | default('letsencrypt_nginx')) == 'manual'
     else '/etc/letsencrypt/live/' ~ mountain_tile_backend_domain ~ '/fullchain.pem' }}
mountain_tile_backend_tls_certificate_key: >-
  {{ reverse_proxy_ssl_certificate_key if (reverse_proxy_certificate_mode | default('letsencrypt_nginx')) == 'manual'
     else '/etc/letsencrypt/live/' ~ mountain_tile_backend_domain ~ '/privkey.pem' }}
